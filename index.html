<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>flying planes</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8%;
        margin: 0;
        text-align: center;
        color: #fff;
        font: 15px/1.4 system-ui, sans-serif;
        text-shadow: 0 1px 4px rgba(40, 30, 60, 0.6);
        opacity: 1;
        transition: opacity 1.2s ease;
        pointer-events: none;
      }
      #hint.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <p id="hint">move to steer, scroll or pinch for speed</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
