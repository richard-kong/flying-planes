<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Landscape studies · Flying Planes</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #152327; color: #fff; font: 14px/1.5 system-ui, sans-serif; }
      canvas { width: 100vw; height: 100vh; display: block; }
      header { position: fixed; top: 30px; left: 32px; text-shadow: 0 2px 8px #17293180; pointer-events: none; }
      h1 { margin: 6px 0; font-size: 27px; font-weight: 500; }
      header p { margin: 0; }
      header small { letter-spacing: .16em; text-transform: uppercase; }
      nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 8px; border: 1px solid #ffffff40; border-radius: 40px; background: #10202ee8; max-width: calc(100vw - 24px); }
      button, select { border: 0; color: white; background: #ffffff12; border-radius: 24px; padding: 10px 14px; font: inherit; cursor: pointer; }
      option { background: #10202e; }
      :focus-visible { outline: 2px solid #b8f1ea; outline-offset: 3px; }
      select { min-width: 0; }
      body.capture header, body.capture nav { display: none; }
      @media (max-width: 600px) { header { left: 20px; top: 20px; } nav { width: max-content; } button, select { padding: 9px; font-size: 12px; } }
    </style>
  </head>
  <body>
    <canvas id="landscape" aria-label="Procedural landscape prototype"></canvas>
    <header><small>Flying Planes · visual prototype</small><h1 id="title"></h1><p id="description"></p></header>
    <nav aria-label="Prototype controls">
      <button id="previous" aria-label="Previous landscape">←</button>
      <select id="variant" aria-label="Landscape direction"></select>
      <button id="next" aria-label="Next landscape">→</button>
      <button id="view">Overview</button>
    </nav>
    <script type="module" src="/src/render/landscape-prototype.ts"></script>
  </body>
</html>
